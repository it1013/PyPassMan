{% extends "base.html" %}
{% block title %}Login - PyPassMan.app{% endblock %}
{% block content %}
<section class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
  <div class="card">
    <div class="card-body">

      <h1 class="h2">Sign in</h1>

      <p class="text-muted small mb-4">
        Enter your email and password to access your dashboard.
      </p>
        {% if errors %}
        <div>
          {% for e in errors %}
            <div class="alert alert-danger alert-dismissible fade show" role="alert">{{e}}</div>
          {% endfor %}
        </div>
        {% endif %}
      <form method="post" action="/logon" novalidate>

        <div class="mb-3">
          <label for="email" class="form-label">
            Email
          </label>

          <input
            id="email"
            name="email"
            type="email"
            required
            maxlength="120"
            class="form-control"
            placeholder="you@example.com"
          />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">
            Password
          </label>

          <input
            id="password"
            name="password"
            type="password"
            required
            minlength="6"
            class="form-control"
            placeholder="••••••••"
          />
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100 mt-2"
        >
          Sign in
        </button>

      </form>

      <p class="mt-4 mb-0 small text-muted">
        Don’t have an account?
        <a href="/register">Register</a>.
      </p>

    </div>
  </div>

</div>
  </div>
</section>
{% endblock %}
